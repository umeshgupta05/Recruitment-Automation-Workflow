# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW 4: ERROR HANDLER SUBFLOW
# Namespace : recruitment.workflows
# Purpose   : Reusable subflow. Called from the errors: block of every other
#             workflow. Logs the error and alerts the ops/recruiter email.
# ─────────────────────────────────────────────────────────────────────────────

id: wf4_error_handler
namespace: recruitment.workflows
description: "Centralised error handler — logs failures and alerts the recruitment ops team."

# ── INPUTS ───────────────────────────────────────────────────────────────────
inputs:
  - id: candidate_name
    type: STRING
    description: "Name of the candidate being processed when the error occurred"

  - id: candidate_email
    type: STRING
    defaults: ""
    description: "Email of the candidate (may be empty for batch workflows)"

  - id: workflow_id
    type: STRING
    defaults: "unknown"
    description: "ID of the workflow that failed"

  - id: error_message
    type: STRING
    defaults: "No error message provided"
    description: "Human-readable error message or exception text"

# ── TASKS ────────────────────────────────────────────────────────────────────
tasks:
  # ── TASK 1: Log the error to the Kestra execution log ────────────────────
  - id: log_error
    type: io.kestra.plugin.core.log.Log
    description: "Writes a structured error log entry visible in the Executions → Logs view."
    message: |
      ══════════════════════════════════════════════
      RECRUITMENT WORKFLOW ERROR
      ══════════════════════════════════════════════
      Workflow ID    : {{ inputs.workflow_id }}
      Candidate Name : {{ inputs.candidate_name }}
      Candidate Email: {{ inputs.candidate_email }}
      Error Message  : {{ inputs.error_message }}
      Execution ID   : {{ execution.id }}
      Timestamp      : {{ now() }}
      ══════════════════════════════════════════════
    level: ERROR

  # ── TASK 2: Send an ops alert email to the recruiter / ops team ───────────
  - id: alert_ops
    type: io.kestra.plugin.notifications.mail.MailSend
    description: "Emails the recruiter/ops team immediately on any workflow failure."
    retry:
      type: constant
      maxAttempt: 2
      interval: PT30S
    from: "umeshgupta050104@gmail.com"
    to: "umeshgupta050104@gmail.com"
    subject: "⚠️ Kestra workflow failure — {{ inputs.workflow_id }}"
    htmlTextContent: |
      <html>
      <body style="font-family: Arial, sans-serif; color: #222;">
        <h2 style="color:#cc0000;">⚠️ Recruitment Workflow Failure</h2>
        <table style="border-collapse:collapse; width:100%; font-size:14px;">
          <tr style="background:#f5f5f5;">
            <td style="padding:8px; font-weight:bold;">Workflow ID</td>
            <td style="padding:8px;">{{ inputs.workflow_id }}</td>
          </tr>
          <tr>
            <td style="padding:8px; font-weight:bold;">Candidate Name</td>
            <td style="padding:8px;">{{ inputs.candidate_name }}</td>
          </tr>
          <tr style="background:#f5f5f5;">
            <td style="padding:8px; font-weight:bold;">Candidate Email</td>
            <td style="padding:8px;">{{ inputs.candidate_email }}</td>
          </tr>
          <tr>
            <td style="padding:8px; font-weight:bold;">Error Message</td>
            <td style="padding:8px; color:#cc0000;">{{ inputs.error_message }}</td>
          </tr>
          <tr style="background:#f5f5f5;">
            <td style="padding:8px; font-weight:bold;">Execution ID</td>
            <td style="padding:8px;">{{ execution.id }}</td>
          </tr>
          <tr>
            <td style="padding:8px; font-weight:bold;">Timestamp</td>
            <td style="padding:8px;">{{ now() }}</td>
          </tr>
        </table>
        <br/>
        <p style="font-size:12px; color:#555;">
          Review the full execution log at:<br/>
          <a href="http://localhost:8080/ui/executions/{{ execution.id }}">
            http://localhost:8080/ui/executions/{{ execution.id }}
          </a>
        </p>
      </body>
      </html>
